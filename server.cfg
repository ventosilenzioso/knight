# Knight (SA-MP 0.3.7 server) Default Configuration
port 7777
hostname "Knight 0.3.7 Server"
gamemode0 "bare 1"
language "English"
password ""
rcon_password "CHANGE_THIS_PASSWORD"
maxplayers 50
worldtime 12
weather 10
gravity 0.008
serialcheck 0

# --- Custom models (SA-MP 0.3.DL) ---
# Custom models are enabled by default; set to 0 to disable them.
useartwork 1
# Optional default folder for bare file names only. Paths written in the
# gamemode (with "/" or a drive letter) are used as-is, like C++ includes.
# artpath models
# Optional: base URL for model downloads (e.g. an HTTP/CDN host).
# artwork_cdn http://127.0.0.1:7777
# artwork_port 7777
# Hidden chassis model for custom vehicles (0.3.DL); 570 = near-invisible.
custom_invisible_vehicle_model 570

# How long a peer may stay silent before the engine drops it (seconds).
# Mobile/mobile-tethered players stall for several seconds; 20 keeps them
# connected without masking a real disconnect.
connect_timeout 20

# Rate limits applied to unknown sources (handshake / query spam protection).
ipratelimit_burst 100
ipratelimit_persec 50

# Streaming radius (world units)
streamdistance 200

# Spawn classes: addclass <skin> <x> <y> <z> <angle> [w1 a1 w2 a2 w3 a3]
addclass 0   1978.0 1343.0 15.0 0 0 0 0 0 0 0
addclass 7   1978.0 1343.0 15.0 0 0 0 0 0 0 0
addclass 21  1978.0 1343.0 15.0 0 0 0 0 0 0 0
addclass 23  1978.0 1343.0 15.0 0 0 0 0 0 0 0
addclass 29  1978.0 1343.0 15.0 0 0 0 0 0 0 0
addclass 100 1978.0 1343.0 15.0 0 0 0 0 0 0 0
addclass 250 1978.0 1343.0 15.0 0 0 0 0 0 0 0
addclass 287 1978.0 1343.0 15.0 0 0 0 0 0 0 0
